    <text class="serif ink" x="512" y="210" font-size="19" font-weight="700">Fixes itself</text>
    <text class="serif muted" x="512" y="231" font-size="13.5" font-style="italic">stuck deploys, dropped daemons</text>
  </g>
  <g transform="rotate(-0.6 585 298)">
