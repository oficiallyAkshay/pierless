    <text class="sans" x="90" y="283" font-size="12.5" font-weight="600" fill="#f7f0de">Merge pull request</text>
    <text class="serif muted" x="58" y="318" font-size="12" font-style="italic">the only thing you do</text>
    <circle class="grommet" cx="266" cy="255" r="6.5"/>
  </g>
