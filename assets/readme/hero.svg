    <text class="serif ink" x="512" y="125" font-size="19" font-weight="700">Deploys instantly</text>
    <text class="serif muted" x="512" y="146" font-size="13.5" font-style="italic">the moment you merge</text>
  </g>
  <g transform="rotate(0.9 585 213)">
    <rect class="c-sea" x="440" y="180" width="290" height="66" rx="6" filter="url(#roughds)"/>
    <circle class="grommet" cx="456" cy="213" r="6.5"/>
