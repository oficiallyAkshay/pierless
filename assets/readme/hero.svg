  <text class="serif brass" x="370" y="321" font-size="17" font-weight="700" text-anchor="middle">Pierless</text>
  <text class="hand muted" x="176" y="402" font-size="17" transform="rotate(-3 176 402)">no pier, no port.</text>
  <text class="hand muted" x="192" y="424" font-size="17" transform="rotate(-3 192 424)">it drops anchor itself.</text>
