    <text class="serif ink" x="512" y="295" font-size="19" font-weight="700">Only what changed</text>
    <text class="serif muted" x="512" y="316" font-size="13.5" font-style="italic">never a full reinstall</text>
  </g>
  <g transform="rotate(1.4 585 383)">
