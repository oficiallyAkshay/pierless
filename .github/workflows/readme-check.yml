# .github/workflows/readme-check.yml — written by `readmerlin init-workflow`;
# hardened to this repo's own workflow bar (permissions, pins, concurrency,
# persist-credentials, timeout), same rules as ci.yml and release.yml.
name: readme check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"

permissions: {}

concurrency:
  group: readme-check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  readmerlin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oficiallyAkshay/readmerlin@65882c2047e9170dbe2132ada0f38c4c127e5b91 # v1.0.0
        with:
          # Every count badge is a shell command in readmerlin.json; without
          # this the check reads their output but never runs them, so a
          # badge could drift from the code it claims to count.
          exec: "true"
