# .github/workflows/release.yml — a pushed vX.Y.Z tag publishes the same
# scripts to npm and to PyPI and cuts the GitHub release.
#
# Both registries are reached by trusted publishing: the job proves who it
# is with a short-lived OIDC token GitHub mints for this workflow file and
# this environment, so no npm or PyPI token is ever stored in this repo.
# That is also why the publish jobs name `environment: release` — the
# registries pin the publisher to that pair, and a workflow renamed or a
# job moved to another environment stops being trusted rather than
# quietly publishing from somewhere new.
#
# Every `uses:` is pinned by full commit SHA with the tag it was resolved
# from in the trailing comment, same rule as ci.yml.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test, then stage both packages at the tagged version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          bash scripts/release/check-pin.sh "$version"
          # The suite stages its own fixture version and clears the staged
          # copies again on the way out, so the staging that gets published
          # has to happen after it, not before.
          bash tests/run.sh
          bash scripts/release/stage.sh "$version"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: packages/

  npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: packages

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Give the scripts back the executable bit
        # An artifact round trip does not carry file permissions, and
        # bin/pierless execs its siblings directly.
        run: chmod +x packages/npm/bin/*

      - name: Publish to npm
        working-directory: packages/npm
        run: |
          set -euo pipefail
          # Trusted publishing over OIDC needs npm 11.5.1 or newer; the
          # node 22 image ships an older npm. Provenance comes from the
          # package's own publishConfig, so publish takes no flags.
          npm install -g npm@latest
          npm publish

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: packages

      - name: Give the scripts back the executable bit
        # Same reason as the npm job: artifacts drop file permissions, and
        # the wheel carries whatever mode the file has when it is built.
        run: chmod +x packages/pypi/src/pierless/bin/*

      - name: Build the sdist and the wheel
        # pipx is already on the ubuntu image, so this needs no install
        # step and nothing lands in the system python.
        run: pipx run build --sdist --wheel packages/pypi

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/pypi/dist

  release:
    needs: [npm, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes are a diff against the previous version tag, which
          # needs that tag and the history between it and here.
          fetch-depth: 0

      - name: Write the notes from the CHANGELOG lines this version added
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname \
            | grep -v "^${TAG}$" | head -n 1 || true)"
          if [ -n "${previous}" ]; then
            git diff "${previous}..HEAD" -- CHANGELOG.md | grep '^+- ' | sed 's/^+//' > notes.md || true
          else
            grep '^- ' CHANGELOG.md > notes.md || true
          fi
          [ -s notes.md ] || echo "- No CHANGELOG entries since ${previous:-the first commit}." > notes.md
          cat notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md

      - name: Move the floating v0 tag onto this release
        # v0 is what a consumer's `uses: oficiallyAkshay/pierless@v0`
        # follows, and it moves only here — after npm and PyPI both
        # accepted this version. Moving it any earlier would point every
        # consumer at a version one of the registries rejected.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git tag -f v0 "$TAG"
          git push -f origin v0
