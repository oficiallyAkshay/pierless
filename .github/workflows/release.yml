# .github/workflows/release.yml — a pushed vX.Y.Z tag runs the test suite,
# cuts the GitHub release from the CHANGELOG, then moves the floating v1
# tag onto it.
#
# pierless is not a package: there is nothing here to publish to npm or
# PyPI. The action is installed straight from this repo, pinned by the
# floating major tag a consumer's `uses:` names.
#
# Every `uses:` is pinned by full commit SHA with the tag it was resolved
# from in the trailing comment, same rule as ci.yml.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tests/run.sh

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes are a diff against the previous version tag, which
          # needs that tag and the history between it and here.
          fetch-depth: 0
          persist-credentials: false

      - name: Write the notes from the CHANGELOG lines this version added
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname \
            | grep -v "^${TAG}$" | head -n 1 || true)"
          if [ -n "${previous}" ]; then
            git diff "${previous}..HEAD" -- CHANGELOG.md | grep '^+- ' | sed 's/^+//' > notes.md || true
          else
            grep '^- ' CHANGELOG.md > notes.md || true
          fi
          [ -s notes.md ] || echo "- No CHANGELOG entries since ${previous:-the first commit}." > notes.md
          cat notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # A re-run after a later step failed finds the release already
        # made, so it refreshes the notes instead of failing on the
        # duplicate.
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi

      - name: Move the floating v1 tag onto this release
        # v1 is what a consumer's `uses: oficiallyAkshay/pierless@v1`
        # follows, and it moves only here, after the tests and the
        # release both succeeded. The checkout above carries no
        # credentials (persist-credentials: false), so the push
        # authenticates the same way the coverage job's badge push
        # does: GH_TOKEN in a basic-auth header, never in the remote URL
        # or a log line.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git tag -f v1 "$TAG"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            push -f "https://github.com/${REPO}.git" refs/tags/v1
