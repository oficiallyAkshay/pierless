# .github/workflows/ci.yml — three jobs in parallel behind one gate; see
# CONTRIBUTING.md's "What CI runs" table. `checks` runs the pre-commit
# hooks a contributor's commit runs, from the same .pre-commit-config.yaml,
# then actionlint. `tests` runs the suite on Linux and macOS, and the
# macOS leg alone lints the rendered launchd plist. `coverage` traces the
# same suite and pushes the badge on a merge to main. `ci` is the only
# context branch protection asks for. Every action is pinned by full
# commit SHA. Coverage is computed locally by
# scripts/ci/coverage-check.py — no Codecov, no upload, no external token.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A superseded PR push has nothing left to prove, but a main run is the
  # record of what landed — cancelling one would leave main's history
  # with a gap no later run fills in.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256_LINUX_AMD64: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  # The same gitleaks release the pre-commit hook pins.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256_LINUX_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  PRE_COMMIT_VERSION: "4.6.2"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, so the secrets scan below reads the whole history.
          fetch-depth: 0
      # Keyed on the config alone: the hook environments only ever change
      # when a rev in it changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: The hooks a contributor's commit runs
        env:
          # That hook reads the staged diff, and nothing is staged in a
          # checkout — the history is scanned separately.
          SKIP: gitleaks
        # pipx ships on the runner image, so pre-commit needs no setup
        # action; its version is pinned above like every other tool.
        run: pipx run --spec "pre-commit==${PRE_COMMIT_VERSION}" pre-commit run --all-files --show-diff-on-failure
      - name: Download pinned gitleaks
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          curl -fsSL -o "${asset}" "${url}"
          echo "${GITLEAKS_SHA256_LINUX_X64}  ${asset}" | sha256sum -c -
          tar -xzf "${asset}" gitleaks
          chmod +x gitleaks
      - name: No secret anywhere in the history
        run: ./gitleaks git --no-banner --redact .
      - name: Download pinned actionlint
        run: |
          set -euo pipefail
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${asset}"
          curl -fsSL -o "${asset}" "${url}"
          echo "${ACTIONLINT_SHA256_LINUX_AMD64}  ${asset}" | sha256sum -c -
          tar -xzf "${asset}" actionlint
          chmod +x actionlint
      - name: actionlint every workflow file
        run: |
          set -euo pipefail
          # action.yml is a composite-action definition, not a workflow
          # file — actionlint has no standalone schema for it and
          # misparses it as a malformed workflow if handed the path
          # directly. See Makefile's lint target for the same note.
          ./actionlint .github/workflows/*.yml

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tests/run.sh
      - name: Render and lint the launchd template
        # plutil is macOS-only, and so is everything the plist drives.
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          sed \
            -e "s|@@LABEL@@|pierless.runner|g" \
            -e "s|@@RUNNER_DIR@@|/tmp/pierless-runner|g" \
            -e "s|@@HOOK@@|/tmp/pierless-runner/hooks/job-started-gate.sh|g" \
            -e "s|@@ALLOWED_WORKFLOW_REF@@|owner/repo/.github/workflows/deploy.yml@refs/heads/main|g" \
            -e "s|@@ALLOWED_REPOSITORY@@|owner/repo|g" \
            -e "s|@@ALLOWED_REF@@|refs/heads/main|g" \
            -e "s|@@ALLOWED_JOB@@|deploy|g" \
            -e "s|@@LOG@@|/tmp/pierless-runner/runner.log|g" \
            -e "s|@@PATH@@|/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin|g" \
            -e "s|@@HOME@@|/tmp|g" \
            templates/launchd.plist.tmpl > /tmp/rendered.plist
          plutil -lint /tmp/rendered.plist

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Write access is needed only by the last step (Publish badge, itself
    # gated to push-to-main only) to push the generated svg/json to the
    # orphan badges branch; every other step in this job only reads.
    permissions:
      contents: write
    # Scoped by ref so PR runs on different branches never share a group
    # (they still run in parallel) — this only serializes two main
    # pushes racing to publish the same badges branch.
    concurrency:
      group: pierless-coverage-badge-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the changed-lines bar on a PR diffs against
          # origin/<base_ref>, which needs that branch's history too.
          fetch-depth: 0
      - name: Run tests under bash's own tracing
        run: |
          set -euo pipefail
          mkdir -p coverage
          PIERLESS_TRACE_FILE="$PWD/coverage/trace.log" bash tests/run.sh
      - name: Coverage gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/ci/coverage-check.py --trace coverage/trace.log \
              --base "origin/${{ github.base_ref || 'main' }}" --min-changed 90 --min-total 100
          else
            python3 scripts/ci/coverage-check.py --trace coverage/trace.log --min-total 100
          fi
      - name: Publish badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          read -r total color <<<"$(python3 -c '
          import json
          d = json.load(open("coverage/summary.json"))
          t = d["total"]
          print(t, "green" if t >= 90 else ("yellow" if t >= 75 else "red"))
          ')"
          mkdir -p badges
          python3 scripts/ci/badge.py coverage "${total}%" "$color" > badges/coverage.svg
          python3 -c "
          import json
          json.dump({'schemaVersion': 1, 'label': 'coverage', 'message': '${total}%', 'color': '${color}'},
                     open('badges/coverage.json', 'w'))
          "
          work="$(mktemp -d)"
          cp badges/coverage.svg badges/coverage.json "$work"
          cd "$work"
          mkdir badges
          mv coverage.svg coverage.json badges/
          git init -q -b badges
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add badges/coverage.svg badges/coverage.json
          git commit -q -m "coverage badge: ${total}%"
          # Same header-injection shape actions/checkout uses so the
          # token never appears in the remote URL or in any log line.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            push --force "https://github.com/${REPO}.git" HEAD:badges

  # The single context branch protection requires. Every check above feeds
  # it, so the ruleset never has to be edited again when a job is added —
  # only this job's `needs:` (tests/workflow.test.sh fails if one is
  # missed). `always()` is what makes a skipped or cancelled upstream
  # reach the gate at all; without it the gate would be skipped too, and a
  # skipped required check reads as green to GitHub.
  ci:
    needs: [checks, tests, coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job this gate needs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "results: ${RESULTS}"
          if [ -z "${RESULTS}" ]; then
            echo "no upstream results — the gate cannot vouch for anything"
            exit 1
          fi
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "a job this gate needs did not succeed: ${result}"
              exit 1
            fi
          done
