# action.yml — composite action wrapping bin/deploy.sh for the pierless
# self-hosted runner. The one-workflow gate lives on the runner (see
# bin/job-started-gate.sh), not here — this file only runs the deploy and
# handles failure/recovery commands around it.
#
# No `uses:` of a checkout action, and no third-party action at all: the
# deploy acts on the LIVE checkout already sitting at `repo` (its own
# fast-forward-from-origin logic in bin/deploy.sh), not a fresh copy in the
# runner's ephemeral workspace. Checking out the ref here would create a
# second, throwaway copy the deploy script never touches.
#
# Optional inputs default to "" here and are handed straight through to
# bin/deploy.sh's own env, which applies ITS defaults on an empty value —
# one source of truth for what "unset" means, not two.
#
# Every value a `run:` step needs is mapped into that step's `env:` and read
# back as `$VAR` — never spliced as `${{ inputs.* }}` / `${{ steps.* }}`
# straight into a script body. A script body carrying that text is exactly
# the expression-injection shape actionlint flags: a value from outside this
# file (a log line, a branch name) can land inside the literal script GitHub
# generates and run as shell rather than as data.
name: pierless
description: Fast-forward a self-hosted Mac's checkout from origin/main and run its deploy hooks.
branding:
  icon: anchor
  color: blue
inputs:
  repo:
    description: Path to the git checkout to deploy.
    required: true
  branch:
    description: Branch to track and fast-forward to.
    required: false
    default: "main"
  log:
    description: Deploy log file path. Empty uses bin/deploy.sh's own default.
    required: false
    default: ""
  lock_dir:
    description: Cross-process lock directory. Empty uses bin/deploy.sh's own default.
    required: false
    default: ""
  install:
    description: Newline "glob=command" pairs run in a changed file's directory; "none" disables; empty uses the npm-install default.
    required: false
    default: ""
  services_dir:
    description: Repo-relative folder of launchd plists to load/unload on change. Empty skips.
    required: false
    default: ""
  kick:
    description: Space-separated launchd labels to kickstart after a pull that moved HEAD. Empty skips.
    required: false
    default: ""
  prune_worktrees:
    description: Prune worktrees whose branch's PR merged. true or false.
    required: false
    default: "true"
  self_label:
    description: launchd label of the runner's own service definition; never reloaded from inside a deploy.
    required: false
    default: "pierless.runner"
  on_failure:
    description: Command to run once when the deploy fails. Empty means no alerting.
    required: false
    default: ""
  on_recovery:
    description: Command to run once on the first successful deploy after a prior failure. Empty means no alerting.
    required: false
    default: ""
  on_park:
    description: Command to run once after a deploy that parks uncommitted edits and then deploys. Empty means no command.
    required: false
    default: ""
  state_dir:
    description: Directory holding the last-failed marker and the hook-idempotency marker between runs.
    required: false
    default: $HOME/.pierless
outputs:
  deployed:
    description: "true if this run fast-forwarded the checkout, false otherwise."
    value: ${{ steps.deploy.outputs.deployed }}
  commits:
    description: Number of commits pulled.
    value: ${{ steps.deploy.outputs.commits }}
runs:
  using: composite
  steps:
    - name: Deploy
      id: deploy
      shell: bash
      env:
        PIERLESS_REPO: ${{ inputs.repo }}
        PIERLESS_BRANCH: ${{ inputs.branch }}
        PIERLESS_LOG: ${{ inputs.log }}
        PIERLESS_LOCK_DIR: ${{ inputs.lock_dir }}
        PIERLESS_STATE_DIR: ${{ inputs.state_dir }}
        PIERLESS_INSTALL: ${{ inputs.install }}
        PIERLESS_SERVICES_DIR: ${{ inputs.services_dir }}
        PIERLESS_KICK: ${{ inputs.kick }}
        PIERLESS_PRUNE_WORKTREES: ${{ inputs.prune_worktrees }}
        PIERLESS_SELF_LABEL: ${{ inputs.self_label }}
        PIERLESS_ON_PARK: ${{ inputs.on_park }}
        PIERLESS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        PIERLESS_STDOUT: "1"
        PIERLESS_TRIGGER: github-actions
        PIERLESS_ACTION_PATH: ${{ github.action_path }}
      run: |
        set +e
        resolved_log="${PIERLESS_LOG:-$HOME/.pierless/deploy.log}"
        echo "log_path=${resolved_log}" >> "${GITHUB_OUTPUT}"
        "${PIERLESS_ACTION_PATH}/bin/deploy.sh"
        code=$?
        echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
        reason="$(tail -n 1 "${resolved_log}" 2>/dev/null || true)"
        echo "reason=${reason}" >> "${GITHUB_OUTPUT}"

    - name: Failure command
      if: steps.deploy.outputs.exit_code != '0'
      shell: bash
      env:
        PIERLESS_STATE_DIR: ${{ inputs.state_dir }}
        PIERLESS_ON_FAILURE: ${{ inputs.on_failure }}
        PIERLESS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        PIERLESS_SHA: ${{ github.sha }}
        PIERLESS_EXIT_CODE: ${{ steps.deploy.outputs.exit_code }}
        PIERLESS_REASON: ${{ steps.deploy.outputs.reason }}
      run: |
        set -uo pipefail
        mkdir -p "$PIERLESS_STATE_DIR"
        echo "$PIERLESS_RUN_URL" > "$PIERLESS_STATE_DIR/last-failed"
        if [ -n "$PIERLESS_ON_FAILURE" ]; then
          eval "$PIERLESS_ON_FAILURE"
        fi
        exit "$PIERLESS_EXIT_CODE"

    - name: Recovery command
      if: steps.deploy.outputs.exit_code == '0'
      shell: bash
      env:
        PIERLESS_STATE_DIR: ${{ inputs.state_dir }}
        PIERLESS_ON_RECOVERY: ${{ inputs.on_recovery }}
        PIERLESS_DEPLOYED: ${{ steps.deploy.outputs.deployed }}
        PIERLESS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        PIERLESS_SHA: ${{ github.sha }}
        PIERLESS_EXIT_CODE: "0"
      run: |
        set -uo pipefail
        marker="$PIERLESS_STATE_DIR/last-failed"
        if [ -f "$marker" ] && [ "$PIERLESS_DEPLOYED" = "true" ]; then
          if [ -n "$PIERLESS_ON_RECOVERY" ]; then
            eval "$PIERLESS_ON_RECOVERY"
          fi
          rm -f "$marker"
        fi
